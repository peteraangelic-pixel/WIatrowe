name: Symulacja + benchmark

# Główny workflow:
#   1) przelicza cały katalog wariantów (Rust + rayon) i generuje raport HTML,
#      CSV i JSON (zapisywane z powrotem na branchu, w katalogu results/),
#   2) sprawdza krzyżowo wyniki Rusta z referencyjną implementacją w Pythonie,
#   3) robi benchmark Rust (rayon, 1..N wątków) vs Python (1 wątek) i wypisuje
#      porównanie do podsumowania joba.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Informacje o maszynie
        run: |
          echo "wątki CPU: $(nproc)"
          rustc --version
          cargo --version
          python3 --version

      - name: Przeliczenie katalogu (sweep)
        continue-on-error: true
        run: |
          mkdir -p results
          cargo run --release -- --mode sweep --quality normal --out results 2>&1 | tee results/console_sweep.txt

      - name: Liczby kontrolne (Rust)
        continue-on-error: true
        run: cargo run --release -- --mode checksum --quality normal --out results 2>&1 | tee results/console_checksum_rust.txt

      - name: Liczby kontrolne (Python - implementacja referencyjna)
        continue-on-error: true
        run: python3 tools/reference_sweep.py --mode checksum --quality normal --out results 2>&1 | tee results/console_checksum_python.txt

      - name: Porównanie Rust vs Python (poprawność modelu)
        continue-on-error: true
        run: python3 tools/compare_checksums.py results/checksums.csv results/checksums_python.csv --tol 1e-9 | tee results/compare_checksums.txt

      - name: Benchmark Rust (rayon)
        continue-on-error: true
        run: |
          cargo run --release -- --mode bench --repeat 40 | tee results/bench_rust.txt

      - name: Benchmark Python
        continue-on-error: true
        run: |
          python3 tools/reference_sweep.py --mode bench --repeat 2 | tee results/bench_python.txt

      - name: Zestawienie prędkości
        run: |
          python3 tools/compare_bench.py results/bench_rust.txt results/bench_python.txt \
            | tee results/bench_summary.txt

      - name: Podsumowanie w jobie
        run: |
          {
            echo "## Wyniki symulacji"
            echo '```'
            head -30 results/summary.csv | cut -c1-200
            echo '```'
            echo "## Benchmark"
            echo '```'
            cat results/bench_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wyniki-wiatrowe
          path: results/

      - name: Zapisz wyniki na branchu
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "brak zmian do zapisania"
            exit 0
          fi
          git commit -m "wyniki: przeliczenie katalogu + benchmark [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "zapisano"; exit 0; fi
            echo "push odrzucony - doscigam branch (proba $i)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep 5
          done
          echo "nie udalo sie zapisac wynikow"
          exit 1
