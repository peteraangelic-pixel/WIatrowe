name: Check & test

# Kompiluje i testuje kod Rusta na każdym pushu.
# Logi są zapisywane do katalogu `ci/` i commitowane na branch - dzięki temu
# można je przeczytać także ze środowisk, w których logi Actions nie są
# dostępne (artefakty/logi leżą na niedostępnej sieci).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo check
        continue-on-error: true
        run: |
          mkdir -p ci
          { echo "### cargo check --all-targets"; cargo check --all-targets 2>&1; echo "exit=$?"; } | tee ci/check.log

      - name: cargo test
        continue-on-error: true
        run: |
          mkdir -p ci
          { echo "### cargo test"; cargo test 2>&1; echo "exit=$?"; } | tee ci/test.log

      - name: clippy
        continue-on-error: true
        run: |
          mkdir -p ci
          { echo "### cargo clippy"; cargo clippy --all-targets 2>&1 | tail -80; } | tee ci/clippy.log

      - name: Zapisz wyniki na branchu
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci
          if git diff --cached --quiet; then
            echo "brak zmian do zapisania"
            exit 0
          fi
          git commit -m "ci: logi kompilacji i testow [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "zapisano"; exit 0; fi
            echo "push odrzucony - doscigam branch (proba $i)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep 5
          done
          echo "nie udalo sie zapisac wynikow"
          exit 1
